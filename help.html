<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNITY Help &amp; User Manual</title>
  <meta name="description" content="About UNITY and the user manual: monthly RT treatment tracking, Division of Radiation Physics, RCC Thiruvananthapuram.">
  <meta name="theme-color" content="#0C343D">
  <link rel="icon" href="assets/logo.jpg">
  <script src="js/prefs.js"></script>
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
  <header class="topbar">
    <img src="assets/logo.jpg" alt="RCC logo">
    <div class="brand"><b>UNITY</b><small>Help &amp; User Manual</small></div>
    <div class="spacer"></div>
    <a class="btn small" href="./">Back to UNITY</a>
  </header>

    <main id="help-root" style="max-width:none;padding:0"></main>
  <script src="js/config.js"></script>
  <script src="js/help.js"></script>
  <script>
    UnityHelp.render(document.getElementById('help-root'));
    (async function () {
      try {
        var url = window.UNITY_CONFIG.API_URL;
        var r = await (await fetch(url + '?action=ping')).json();
        if (!r || !r.version) return;
        var d = new Date(r.releaseDate + 'T00:00:00');
        var ds = isNaN(d) ? r.releaseDate : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('about-version').textContent = 'v' + r.version;
        document.getElementById('about-date').textContent = ds;
      } catch (e) { /* offline: leave placeholders */ }
    })();
  </script>
</body>
</html>
